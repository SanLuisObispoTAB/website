name: SLOTAB — refresh weekly events

# Refreshes src/app/data/weekly-events.json from the public
# SLOHS Athletic Department Google Sheet every morning. The job commits
# only when the data changed, which triggers a Vercel redeploy; a day with
# no change costs one ~20s run and no commit.
#
# Daily since #266. It used to run Monday and Wednesday only, and GitHub
# often starts scheduled jobs hours late (Monday's 06:00 run landed between
# 11:00 and 14:30 Pacific through October-November). The ticker had already
# run out of games by the time the new week's tab was picked up. A daily run
# also catches the department adding a game mid-week.

on:
  schedule:
    # 06:00 Pacific (14:00 UTC; 05:00 PST in winter) every day.
    - cron: "0 14 * * *"
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Run the scraper
        run: node scripts/update-slotab-events.mjs

      - name: Commit if data changed
        run: |
          # tnn-videos.json was removed per board decision (TNN dropped 2026-04-23)
          FILES="src/app/data/weekly-events.json"
          if [[ -z "$(git status --porcelain $FILES)" ]]; then
            echo "No changes to commit."
            exit 0
          fi
          # Committer must be a Vercel team member for Vercel to auto-deploy
          # this commit. Matches the identity used by the rest of this repo.
          git config user.name "Erik Ramberg"
          git config user.email "erik@ravens-peak-consulting.com"
          git add $FILES
          git commit -m "slotab: refresh weekly events"
          git push
