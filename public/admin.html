<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>SLOTAB Admin</title>
    <link
      rel="icon"
      type="image/png"
      href="/logos/slotab-booster-club.png"
    />
    <!--
      Hint to Decap so it resolves config.yml from this directory
      regardless of trailing-slash on the URL.
    -->
    <link
      rel="cms-config-url"
      type="text/yaml"
      href="/admin/config.yml"
    />
  </head>
  <body>
    <!--
      Decap CMS. The script replaces the body at runtime with its own
      editor UI. This file is intentionally a plain static page with
      zero framework code so nothing fights with Decap's DOM takeover.
    -->
    <!--
      Pinned + SRI. Dependabot does NOT see this script (it only reads the
      npm lockfile), so bumping it is a manual job: change the version,
      recompute the hash with
        curl -sL https://unpkg.com/decap-cms@<ver>/dist/decap-cms.js \
          | openssl dgst -sha384 -binary | openssl base64 -A
      and load /admin once to confirm the config still parses. 3.3.3 ->
      3.16.3 on 2026-09-30 (#249, from the independent review's SEC-01).
    -->
    <script
      src="https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js"
      integrity="sha384-A/Gdn928CNLufmnGWGs9RM4Q9o8bSNLeJERqBFrBjwzL7FRpoLT3MPF8Tl0+Wd2p"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
