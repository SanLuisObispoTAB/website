# Decap CMS configuration for the SLOTAB website.
#
# When an editor saves in the admin, Decap calls the GitHub API to
# commit the updated file to main. Vercel detects the push and
# redeploys automatically.
#
# Wired to:
#   - Repo:     https://github.com/SanLuisObispoTAB/website
#     (renamed from eramberg/slo-tab-website 2026-05; GitHub
#      redirects API + git traffic from the old path)
#   - Vercel:   https://slo-tab-website.vercel.app  (transitional;
#     see decision #67 — new project under the Raven's Peak Vercel
#     team is the working deploy target until the SLOTAB-org Vercel
#     pricing question is resolved)
#
# 2026-08-11 slotab.org cutover: site_url / display_url / logo_url are
# swapped to slotab.org below — they are cosmetic (the "View site" link,
# the label, and the login-screen logo).
#
# base_url deliberately STAYS on the Vercel URL. It is the host the OAuth
# handshake round-trips through, and the GitHub OAuth App is registered
# with a single callback URL pointing there. Swapping it before that
# registration is updated would break /admin login for the whole board.
# slotab.org is already in the postMessage allowlist (decision #65), so
# board members can reach /admin at slotab.org/admin today and the token
# comes back correctly. Change base_url only in the same sitting as the
# GitHub OAuth App callback URL.

backend:
  name: github
  repo: SanLuisObispoTAB/website
  branch: main
  # Our own Next.js API routes handle the OAuth handshake so we don't
  # depend on Netlify Identity.
  base_url: https://slo-tab-website.vercel.app
  auth_endpoint: /api/decap/auth

# Uploaded media (sponsor logos, board photos, etc.) land here and
# are served at /uploads/<filename>.
media_folder: "public/uploads"
public_folder: "/uploads"

# Save as drafts first; click publish to commit.
publish_mode: editorial_workflow

site_url: https://slotab.org
display_url: https://slotab.org
logo_url: https://slotab.org/logos/slotab-booster-club.png

collections:
  # ---------------------------------------------------------------
  # Business sponsors, grouped by tier
  # ---------------------------------------------------------------
  - name: sponsors
    label: "Business Sponsors"
    files:
      - name: sponsors
        label: "Sponsor Wall"
        file: "src/app/data/sponsors.json"
        description: "Business sponsors shown on the Membership page, cleared and re-tiered fresh each season. Tiers, top down: Champion $10,000 · Gold $5,000 · Silver $2,500 · Tiger Pride $1,000 · Varsity $500. Spell tier names exactly — the wall derives its CSS class from the name. Every logo also needs a matching transparent version at the same path under /sponsors/alpha/, or the homepage wall shows a broken image."
        fields:
          - { name: season, label: "Season", widget: string }
          - name: tiers
            label: "Tiers"
            widget: list
            fields:
              - name: tier
                label: "Tier"
                widget: select
                options: ["Champion", "Gold", "Silver", "Varsity"]
              - name: sponsors
                label: "Sponsors in this tier"
                widget: list
                fields:
                  - { name: name, label: "Business name", widget: string }
                  - {
                      name: logo,
                      label: "Logo",
                      widget: image,
                      hint: "Upload the sponsor's logo (PNG, JPG or SVG).",
                    }
                  - {
                      name: website,
                      label: "Website URL (optional)",
                      widget: string,
                      required: false,
                      pattern:
                        [
                          "^(https?://.+)?$",
                          "Must start with https:// or http://, or leave blank.",
                        ],
                      hint: "Full URL including https://. When set, the sponsor's logo on the wall and home page becomes a clickable link to this URL.",
                    }

  # ---------------------------------------------------------------
  # Seasonal Donate drive (controls the prominent Donate CTA)
  # ---------------------------------------------------------------
  - name: campaign
    label: "Donate Drive"
    files:
      - name: donate_drive
        label: "Seasonal Donate Drive"
        file: "src/app/data/campaign.json"
        description: "Controls whether the prominent 'Donate Now' button is featured. Outside a drive, Membership is the primary call-to-action."
        fields:
          - name: donateDrive
            label: "Donate Drive"
            widget: object
            fields:
              - name: mode
                label: "Mode"
                widget: select
                options: ["off", "on", "auto"]
                hint: "off = Donate demoted (Membership leads). on = feature Donate now. auto = feature Donate only between the dates below."
                default: "off"
              - {
                  name: startsOn,
                  label: "Drive starts (auto mode)",
                  widget: date,
                  format: "YYYY-MM-DD",
                }
              - {
                  name: endsOn,
                  label: "Drive ends (auto mode)",
                  widget: date,
                  format: "YYYY-MM-DD",
                }
              - {
                  name: label,
                  label: "Drive name",
                  widget: string,
                  hint: "e.g. Fall Donation Drive (for your reference).",
                }

  # ---------------------------------------------------------------
  # Board roster (shown on the Contact page)
  # ---------------------------------------------------------------
  - name: board
    label: "Board Members"
    files:
      - name: board
        label: "Board Roster"
        file: "src/app/data/board.json"
        description: "Current SLOTAB board members shown on the Contact page."
        fields:
          - { name: year, label: "School year label (e.g. 2025-26)", widget: string }
          - name: members
            label: "Members"
            widget: list
            fields:
              - { name: role, label: "Role", widget: string }
              - { name: name, label: "Name", widget: string }
              - {
                  name: email,
                  label: "Public email (optional)",
                  widget: string,
                  required: false,
                  hint: "Use a SLOTAB role-based email (e.g. slotabpres@gmail.com), never a personal address.",
                }

  # ---------------------------------------------------------------
  # Teams — per-sport pages
  # ---------------------------------------------------------------
  - name: teams_index
    label: "Teams — Index"
    files:
      - name: teams_index
        label: "Master team list"
        file: "src/app/data/teams.json"
        description: "Every CIF varsity team. Flip hasPage to true once a team-specific JSON is created and a route page exists."
        fields:
          - name: teams
            label: "Teams"
            widget: list
            fields:
              - { name: slug, label: "Slug (URL)", widget: string }
              - { name: name, label: "Sport", widget: string }
              - {
                  name: gender,
                  label: "Gender",
                  widget: select,
                  options: ["Boys", "Girls", "Co-ed"],
                  required: false,
                  hint: "Leave blank for a team with no gender designation (Tiger Cheer). Blank shows the team as just its name everywhere — nav, carousel, /teams cards, donate dropdown — with no gender label.",
                }
              - {
                  name: season,
                  label: "Season",
                  widget: select,
                  options: ["Fall", "Winter", "Spring", "Year-round"],
                }
              - {
                  name: hasPage,
                  label: "Has its own page?",
                  widget: boolean,
                  default: false,
                }

  - name: teams_football
    label: "Team — Football"
    files:
      - name: football
        label: "Football"
        file: "src/app/data/teams/football.json"
        fields:
          - { name: slug, label: "Slug", widget: string }
          - { name: name, label: "Team name", widget: string }
          - { name: sport, label: "Sport", widget: string }
          - { name: gender, label: "Gender", widget: string, required: false, hint: "Leave blank for a team with no gender designation (Tiger Cheer)." }
          - { name: season, label: "Season", widget: string }
          - { name: tagline, label: "Tagline", widget: string, required: false }
          - {
              name: heroPhoto,
              label: "Hero photo (action shot for the top banner)",
              widget: image,
              required: false,
              hint: "ACTION SHOTS ONLY — a real in-game photo. Do NOT put a posed team portrait here; that goes in 'Team photo' below. Leave empty until a real action shot exists: the banner then renders as a plain black band, which is fine and preferred over a posed shot pretending to be action.",
            }
          - {
              name: teamPhoto,
              label: "Team photo (posed portrait for the 'Meet the Team' section)",
              widget: image,
              required: false,
              hint: "Use this when the team has ONE squad photo. For a combined team with a boys and a girls squad, leave this empty and use 'Team photos' below instead.",
            }
          - name: teamPhotos
            label: "Team photos — combined teams with more than one squad"
            widget: list
            required: false
            hint: "Only for a team that fields separate squads on one page (e.g. cross country). Overrides the single 'Team photo' above. Give each a label so visitors can tell them apart."
            fields:
              - { name: photo, label: "Photo", widget: image }
              - { name: label, label: "Squad label (e.g. Boys, Girls)", widget: string, required: false }
              - { name: note, label: "Note under the label", widget: text, required: false, hint: "Optional sentence for when the photo needs explaining — a squad that has since split, a photo from a previous season, a group that isn't quite what the label says. Keep the label itself to one or two words; this is where the explanation goes." }
          - {
              name: gallery,
              label: "Action photo gallery (grid of in-game shots below the portrait)",
              widget: list,
              required: false,
              field: { name: photo, label: "Photo", widget: image },
              hint: "ACTION SHOTS ONLY. This renders under an 'In Action' heading, so a posed portrait here reads as a mistake. If the team has no action shots yet, leave this empty — the whole section is hidden rather than shown with the wrong kind of photo.",
            }
          - { name: eventCategory, label: "Event category", widget: string, required: false, hint: "Must match a category used in weekly-events.json so schedule auto-populates." }
          - name: headCoach
            label: "Head Coach (single-coach teams)"
            widget: object
            required: false
            fields:
              - { name: name, label: "Name", widget: string }
              - { name: email, label: "Email", widget: string, required: false }
              - { name: bio, label: "Bio", widget: text, required: false }
          - name: headCoaches
            label: "Head Coaches — combined teams with more than one"
            widget: list
            required: false
            hint: "Only for a combined team run by two head coaches (e.g. cross country). Overrides the single 'Head Coach' above. Set each one's Role so visitors can tell which squad they lead."
            fields:
              - { name: name, label: "Name", widget: string }
              - {
                  name: role,
                  label: "Role label",
                  widget: string,
                  required: false,
                  hint: "Shown above the name in the facts band. E.g. 'Head Coach — Boys'. Defaults to 'Head Coach'.",
                }
              - { name: email, label: "Email", widget: string, required: false }
              - { name: bio, label: "Bio", widget: text, required: false }
          - name: liaisons
            label: "SLOTAB Team Liaisons"
            widget: list
            fields:
              - { name: name, label: "Name", widget: string }
              - { name: email, label: "Email", widget: string }
          - name: captains
            label: "Captains"
            widget: list
            field: { name: name, label: "Name", widget: string }
          - name: roster
            label: "Roster"
            widget: list
            fields:
              - { name: number, label: "Number", widget: number, value_type: int }
              - { name: name, label: "Player name", widget: string }
              - {
                  name: year,
                  label: "Year",
                  widget: select,
                  options: ["Freshman", "Sophomore", "Junior", "Senior"],
                }
              - { name: position, label: "Position", widget: string }
          - name: wishlist
            label: "Wishlist"
            widget: list
            fields:
              - { name: item, label: "Item", widget: string }
              - { name: cost, label: "Cost", widget: string, required: false, hint: "A plain number (1000) is formatted as $1,000. For a range or per-unit price, type it exactly as you want it shown — \"$3,000–4,000\", \"$50–100 each\". Leave blank for \"Pricing TBD\"." }
          - name: externalLinks
            label: "External links"
            widget: list
            fields:
              - { name: label, label: "Label", widget: string }
              - { name: url, label: "URL", widget: string }

  # (Copy-paste the block above as 'teams_girls_volleyball' / 'teams_baseball'
  # pointing at data/teams/girls-volleyball.json and data/teams/baseball.json
  # once you want those editable via CMS. Omitted here to keep the config
  # short for the prototype.)

  # ---------------------------------------------------------------
  # Impact — what SLOTAB donations funded
  # ---------------------------------------------------------------
  - name: impact
    label: "Impact Ledger"
    files:
      - name: impact
        label: "Donation-Funded Purchases"
        file: "src/app/data/impact.json"
        description: "What SLOTAB gave back to SLOHS athletics. Drives the headline stats, the 'Where It Went' list, and the funded-programs band on the Impact page. Figures come from the year-end Transaction Report — the line items must add up to the summary total."
        fields:
          - {
              name: note,
              label: "Page note (shown under the intro)",
              widget: text,
              hint: "Internal maintenance note — NOT shown on the site. Public copy on /impact is in the page itself.",
              required: false,
            }
          - { name: currency, label: "Currency code", widget: string, default: "USD" }
          - {
              name: fiscalYear,
              label: "School year",
              widget: string,
              hint: "E.g. 2025-26. The booster fiscal year runs July-June.",
            }
          - name: summary
            label: "Headline stats (the three gold numbers at the top)"
            widget: object
            fields:
              - {
                  name: total,
                  label: "Total given to SLOHS athletics",
                  widget: number,
                  value_type: float,
                  hint: "Must equal the sum of all line items below.",
                }
              - { name: programsSupported, label: "Programs supported", widget: number, value_type: int }
              - { name: coachesFunded, label: "Coaches funded", widget: number, value_type: int }
          - name: categories
            label: "Categories (shown as colored tag on each item)"
            widget: list
            fields:
              - { name: key, label: "Key (slug)", widget: string, hint: "e.g. equipment, travel, food" }
              - { name: label, label: "Display label", widget: string }
          - name: items
            label: "Line items"
            widget: list
            fields:
              - { name: year, label: "School year (e.g. 2024-25)", widget: string }
              - { name: team, label: "Team / program", widget: string, hint: "E.g. 'Girls Water Polo' or 'All Sports' for shared purchases" }
              - {
                  name: category,
                  label: "Category",
                  widget: select,
                  options:
                    [
                      "equipment",
                      "facilities",
                      "travel",
                      "food",
                      "apparel",
                      "recognition",
                      "training",
                      "all-athletes",
                      "allocation",
                      "coaching",
                    ],
                }
              - { name: description, label: "Description", widget: string }
              - { name: cost, label: "Cost (dollars)", widget: number, value_type: float }
              - {
                  name: photo,
                  label: "Photo (optional)",
                  widget: image,
                  required: false,
                  hint: "Upload a photo of the item or a game photo from the team.",
                }
          - name: programs
            label: "Programs funded this year (name only, no dollar figures)"
            widget: list
            field: { name: name, label: "Program", widget: string }
            hint: "Shown as a chip band at the bottom of the page. Per-team dollar amounts are deliberately not published — see decision #103."

  # ---------------------------------------------------------------
  # Featured event pages — the standalone page for a single event
  # (Back to School Day, Booster Bash). Every field below except
  # slug/kicker/title is optional; the page hides whatever is blank,
  # so an event can go live with a date and fill in as artwork and
  # copy arrive.
  # ---------------------------------------------------------------
  - name: featured_events
    label: "Featured Event Pages"
    files:
      - name: featured_events
        label: "Event Pages"
        file: "src/app/data/featured-events.json"
        description: "Standalone pages for individual SLOTAB events. Each entry's `slug` must match an existing route (currently back-to-school and booster-bash) — adding a new slug here does NOT create a page on its own, ask the site maintainer. Keep the date in sync with the matching row in SLOTAB Events, which is what drives the calendar."
        fields:
          - name: events
            label: "Event pages"
            widget: list
            fields:
              - {
                  name: slug,
                  label: "Slug (must match the route)",
                  widget: string,
                  hint: "back-to-school or booster-bash",
                }
              - { name: kicker, label: "Kicker (small text above the title)", widget: string }
              - { name: title, label: "Title", widget: string }
              - {
                  name: dateLabel,
                  label: "Date (as displayed)",
                  widget: string,
                  required: false,
                  hint: "e.g. Saturday, October 10, 2026",
                }
              - {
                  name: timeLabel,
                  label: "Time (as displayed)",
                  widget: string,
                  required: false,
                }
              - {
                  name: date,
                  label: "Date & time (machine-readable)",
                  widget: datetime,
                  required: false,
                  hint: "Keep this matching the SLOTAB Events entry for the same event.",
                }
              - { name: venueName, label: "Venue name", widget: string, required: false }
              - { name: venueDetail, label: "Venue detail / one-line blurb", widget: text, required: false }
              - {
                  name: photo,
                  label: "Flyer or hero image",
                  widget: image,
                  required: false,
                  hint: "Leave empty until the real artwork exists — the frame is skipped rather than showing a broken image.",
                }
              - { name: photoAlt, label: "Image alt text", widget: string, required: false }
              - {
                  name: intro,
                  label: "Lead copy (shown at the top, above the date/venue box)",
                  widget: list,
                  required: false,
                  field: { name: paragraph, label: "Paragraph", widget: text },
                  hint: "For a welcome or announcement that should be read first. The FIRST paragraph is set larger — put the headline sentence there. Everything else belongs in Body paragraphs below.",
                }
              - {
                  name: body,
                  label: "Body paragraphs (shown below the date/venue box)",
                  widget: list,
                  required: false,
                  field: { name: paragraph, label: "Paragraph", widget: text },
                }
              - {
                  name: contactEmail,
                  label: "Event contact email",
                  widget: string,
                  required: false,
                  hint: "Shown at the end of the copy. Leave empty to point people at the general contact page instead.",
                }
              - { name: ctaLabel, label: "Main button label", widget: string, required: false }
              - {
                  name: ctaUrl,
                  label: "Main button URL",
                  widget: string,
                  required: false,
                  hint: "Ticketing or signup link. Leave empty and the button is hidden — never ship a button that goes nowhere.",
                }
              - {
                  name: qrImage,
                  label: "Scannable QR tag",
                  widget: image,
                  required: false,
                  hint: "Only shown when the main button has a URL. Should point at the same place as that button.",
                }
              - { name: qrCaption, label: "QR caption", widget: string, required: false }
              - name: links
                label: "Secondary links"
                widget: list
                required: false
                fields:
                  - { name: label, label: "Label", widget: string }
                  - {
                      name: url,
                      label: "URL",
                      widget: string,
                      hint: "Full https:// URL for outside links, or a path like /hall-of-fame for pages on this site.",
                    }

  # ---------------------------------------------------------------
  # Hall of Fame — induction ceremony, committee, mission, etc.
  # ---------------------------------------------------------------
  - name: hall_of_fame
    label: "Hall of Fame"
    files:
      - name: hof
        label: "Hall of Fame Page"
        file: "src/app/data/hof.json"
        description: "Mission statement, induction ceremony details, committee roster, nomination form links, and Alumni Membership copy."
        fields:
          - { name: missionStatement, label: "Mission statement", widget: text }
          - {
              name: officialPage,
              label: "Official SLOHS HOF page URL",
              widget: string,
            }
          - name: nominationForms
            label: "Nomination form URLs"
            widget: object
            fields:
              - { name: athlete, label: "Athlete nomination URL", widget: string }
              - { name: coach, label: "Coach nomination URL", widget: string }
          - name: nominationCriteria
            label: "Nomination criteria bullet points"
            widget: object
            fields:
              - {
                  name: athlete,
                  label: "Athlete criteria",
                  widget: list,
                  field: { name: bullet, label: "Bullet", widget: string },
                }
              - {
                  name: coach,
                  label: "Coach criteria",
                  widget: list,
                  field: { name: bullet, label: "Bullet", widget: string },
                }
          - name: ceremony
            label: "Induction ceremony"
            widget: object
            fields:
              - { name: title, label: "Title (e.g. 'Class of 2026 Induction')", widget: string }
              - { name: dateLabel, label: "Date label (e.g. 'October 3, 2026')", widget: string }
              - { name: date, label: "ISO date/time", widget: datetime }
              - { name: venueName, label: "Venue name", widget: string }
              - { name: venueDetail, label: "Venue detail / blurb", widget: text }
              - {
                  name: ticketsUrl,
                  label: "Booster Bash tickets URL",
                  widget: string,
                  required: false,
                  hint: "Leave empty to hide the Tickets button entirely — better than a link that goes nowhere.",
                }
              - {
                  name: donateUrl,
                  label: "HOF Fund donate URL",
                  widget: string,
                  required: false,
                  hint: "Leave empty and the button falls back to the general /donate page.",
                }
          - name: committee
            label: "Committee members"
            widget: list
            required: false
            hint: "Leave the list empty to hide the whole Committee section."
            fields:
              - { name: name, label: "Name", widget: string }
              - { name: role, label: "Role", widget: string }
              - {
                  name: note,
                  label: "Note (optional)",
                  widget: string,
                  required: false,
                }
          - name: alumniMembership
            label: "Alumni Membership block"
            widget: object
            fields:
              - { name: title, label: "Heading", widget: string }
              - { name: blurb, label: "Blurb", widget: text }
              - {
                  name: joinUrl,
                  label: "Join URL",
                  widget: string,
                  required: false,
                  hint: "The whole Alumni Membership section stays hidden until this is set — there is no Alumni tier on the 2026-27 membership sheet yet.",
                }

  - name: hof_inductees
    label: "Hall of Fame — Inductees"
    files:
      - name: inductees
        label: "Inductee Roster"
        file: "src/app/data/hof-inductees.json"
        description: "Full roster of SLOHS Hall of Fame inductees. Add new inductees after each class is announced."
        fields:
          - name: inductees
            label: "Inductees"
            widget: list
            fields:
              - { name: name, label: "Name", widget: string }
              - { name: yearsAtSLOHS, label: "Years at SLOHS", widget: string }
              - { name: yearInducted, label: "Year inducted", widget: string }
              - { name: sport, label: "Sport(s)", widget: string, hint: "Comma-separated if multiple. 'Coach' for coach inductees." }
              - {
                  name: note,
                  label: "Note (optional)",
                  widget: string,
                  required: false,
                  hint: "E.g. 'Posthumous', '12 Varsity Letters', 'CIF in Dodger Stadium'",
                }

  # ---------------------------------------------------------------
  # SLOTAB booster events (meetings, fundraisers, Spring Social)
  # ---------------------------------------------------------------
  - name: slotab_events
    label: "SLOTAB Events"
    files:
      - name: events
        label: "Event List"
        file: "src/app/data/slotab-events.json"
        description: "Non-sport events shown on the Upcoming page, the home calendar, the top-of-site ticker, and (for 'SLOTAB Meeting' entries) the meeting list on /volunteer. Add the 2026-27 board meetings, Physical Night, parent meetings, and fundraisers here. Sport events are imported automatically from the athletic department's weekly sheet."
        fields:
          - name: events
            label: "Events"
            widget: list
            fields:
              - {
                  name: id,
                  label: "ID",
                  widget: string,
                  hint: "Unique slug, e.g. ns-spring-social-2026",
                }
              - { name: title, label: "Title", widget: string }
              - { name: date, label: "Date & time", widget: datetime }
              - {
                  name: categoryLabel,
                  label: "Category label",
                  widget: select,
                  options: ["SLOTAB Event", "SLOTAB Meeting", "Fundraiser"],
                }
              - {
                  name: note,
                  label: "Short note (optional)",
                  widget: string,
                  required: false,
                  hint: "A brief annotation for a meeting that breaks the usual cadence, e.g. \"moved a week — the first Monday is Labor Day\". Shown next to the date on the Volunteer page.",
                }
              - {
                  name: href,
                  label: "Event page link",
                  widget: string,
                  required: false,
                  hint: "Optional. If this event has its own page (e.g. /booster-bash), put the path here and the calendar rows link to it. Leave empty otherwise.",
                }
              - {
                  name: detail,
                  label: "Detail line (optional)",
                  widget: string,
                  required: false,
                  hint: "Shown under the title. E.g. '6:00 PM at Cannon, 1050 Southwood Drive'",
                }

  # ---------------------------------------------------------------
  # Board handoff notes (rendered on the password-gated /board hub).
  # NEVER paste passwords, account numbers, or other secrets into these
  # fields — describe where they LIVE (e.g. "1Password vault, owner Trina")
  # instead. The repo is public; field auth only gates the rendered page.
  # ---------------------------------------------------------------
  - name: board_handoff
    label: "Board Handoff Notes"
    files:
      - name: board_handoff
        label: "Handoff Notes"
        file: "src/app/data/board-handoff.json"
        description: "Role-by-role exit notes for outgoing board officers. New officer reads last year's before Day 1. NEVER paste passwords or other secrets here — describe where they live instead."
        fields:
          - {
              name: _note,
              label: "Editorial note (do not delete)",
              widget: string,
              required: false,
            }
          - name: handoffs
            label: "Handoff entries"
            widget: list
            summary: "{{fields.year}} — {{fields.role}} ({{fields.incumbent}})"
            fields:
              - {
                  name: id,
                  label: "ID",
                  widget: string,
                  hint: "Unique slug, e.g. '2025-26-president'. Used as the dedup key.",
                }
              - {
                  name: year,
                  label: "School year",
                  widget: string,
                  hint: "Format: 2025-26",
                }
              - { name: role, label: "Role title", widget: string }
              - {
                  name: role_slug,
                  label: "Role slug (URL)",
                  widget: string,
                  hint: "Lowercase, hyphens. Must match the slug derived from the role on the Board Roster. E.g. 'president', 'vice-president-membership', 'treasurer'.",
                }
              - {
                  name: incumbent,
                  label: "Outgoing officer name",
                  widget: string,
                }
              - {
                  name: successor,
                  label: "Incoming officer name (if known)",
                  widget: string,
                  required: false,
                  default: "—",
                }
              - {
                  name: completed_date,
                  label: "Date handoff completed",
                  widget: string,
                  required: false,
                  hint: "ISO date YYYY-MM-DD",
                }
              - {
                  name: what_worked,
                  label: "What worked this year",
                  widget: text,
                  required: false,
                  hint: "3-5 bullets the next officer should keep doing.",
                }
              - {
                  name: what_broke,
                  label: "What broke / what I'd do differently",
                  widget: text,
                  required: false,
                  hint: "Be specific. Most-read section.",
                }
              - {
                  name: who_to_call,
                  label: "Who to call first when something breaks",
                  widget: text,
                  required: false,
                  hint: "Names + best contact method. Personality notes welcome.",
                }
              - {
                  name: punted_decisions,
                  label: "Decisions I punted to next year",
                  widget: text,
                  required: false,
                  hint: "What got deferred, and why.",
                }
              - {
                  name: vendor_relationships,
                  label: "Vendor relationships",
                  widget: text,
                  required: false,
                  hint: "Who's friendly, who needs handling, who to email vs. call.",
                }
              - {
                  name: passwords_vault_pointer,
                  label: "Where the logins LIVE (NOT the logins themselves)",
                  widget: text,
                  required: false,
                  hint: "⚠ Never paste passwords here. Describe the vault: 'SLOTAB 1Password vault, owner Trina, recovery email ___'.",
                }
              - {
                  name: calendar_landmarks,
                  label: "Calendar landmarks that snuck up on me",
                  widget: text,
                  required: false,
                  hint: "Dates the next officer needs NOW.",
                }
              - {
                  name: open_todos,
                  label: "Open TODOs at handover",
                  widget: text,
                  required: false,
                  hint: "What's unfinished. Day 1 reading.",
                }
              - {
                  name: anything_else,
                  label: "Anything else the next officer needs",
                  widget: text,
                  required: false,
                  hint: "History, tribal knowledge, things that don't fit above.",
                }
